# Configuração DO TIME (workspace). Marcador da Tia: a existência deste arquivo em .tia/config.yaml liga a Tia.
# Perfil GPM (Group Product Manager): portfólio de vários times; sem fila de demandas (épico e histórias ficam na
# pasta de cada PM). Criado pelo "Tia, configurar"; depois só a humana edita. Versionado no git.
# Tudo o que não está aqui vem do padrão do plugin (modelos/config.padrao.yaml). Para ajustar um default
# (dados.*, confluence.c1_validade_horas, metricas), repita só a chave.
# Regras inegociáveis (escopo de escrita, gates, escrita no Jira/Confluence/dados) não podem ser sobrepostas.
modelo_versao: 1
perfil: gpm

atlassian:
  site: "{site}"                      # ex.: https://empresa.atlassian.net
  cloud_id: "{cloud_id}"
  jira_projetos: {jira_lista}   # projetos do Jira dos times do grupo (só leitura)
  espacos_confluence: {espacos_lista}   # espaços que a Tia consulta

# Política por espaço: no máximo um espaço marcado `manter` (alterado só com C1); pode não haver nenhum. Os demais
# (e qualquer espaço fora desta lista) são somente leitura: regra do plugin, não configurável.
confluence:
  espacos:
{espacos_bloco}

modelos:
  permitidos: [opus, sonnet, haiku]
  esforco: medium
